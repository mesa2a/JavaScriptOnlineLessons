<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>レッスン96：配列の結合</title>
</head>
<body>
  <h1>メニュー管理システム</h1>

  <div>
    <h2>前菜（🥗 Appetizer）</h2>
    <input type="text" id="appetizerInput" placeholder="前菜メニュー">
    <button id="addAppetizer">追加</button>
    <div id="appetizerList"></div>
  </div>

  <div>
    <h2>メイン（🍖 Main）</h2>
    <input type="text" id="mainInput" placeholder="メインメニュー">
    <button id="addMain">追加</button>
    <div id="mainList"></div>
  </div>

  <div>
    <h2>デザート（🍰 Dessert）</h2>
    <input type="text" id="dessertInput" placeholder="デザートメニュー">
    <button id="addDessert">追加</button>
    <div id="dessertList"></div>
  </div>

  <div>
    <h2>フルコース</h2>
    <button id="showFullCourse">フルコース表示</button>
    <div id="fullCourse"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
