<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メッセージ変更アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>💬 メッセージ変更</h1>

    <div class="message-box">
      <div id="message">ボタンを押してください</div>
    </div>

    <div class="buttons">
      <button onclick="showMorning()" class="morning">おはよう</button>
      <button onclick="showAfternoon()" class="afternoon">こんにちは</button>
      <button onclick="showEvening()" class="evening">こんばんは</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
