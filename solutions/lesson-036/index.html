<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>レッスン36: 週のまとめプロジェクト</title>
  <script src="script.js"></script>
</head>
<body>
  <h1>総合判定システム</h1>

  <section>
    <h2>年齢判定</h2>
    <button onclick="checkAge()">判定する</button>
    <p id="age-result"></p>
  </section>

  <section>
    <h2>点数判定</h2>
    <button onclick="checkScore()">判定する</button>
    <p id="score-result"></p>
  </section>

  <section>
    <h2>カウンター判定</h2>
    <button onclick="addCount()">クリック</button>
    <p>カウント: <span id="counter">0</span></p>
    <p id="counter-message"></p>
  </section>
</body>
</html>
