<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>レッスン47: 複雑な条件</title>
  <script src="script.js"></script>
</head>
<body>
  <h1>イベント参加資格チェック</h1>

  <section>
    <h2>情報入力</h2>
    <div>
      <label>年齢:</label>
      <input id="age" type="text" placeholder="年齢を入力">
    </div>
    <div>
      <label>
        <input id="hasTicket" type="checkbox">
        チケットを持っている
      </label>
    </div>
    <div>
      <label>
        <input id="isVIP" type="checkbox">
        VIP会員
      </label>
    </div>
    <button onclick="checkEvent()">参加資格チェック</button>
  </section>

  <section>
    <h2>結果</h2>
    <p id="result"></p>
    <p id="error" style="color: red;"></p>
  </section>
</body>
</html>
