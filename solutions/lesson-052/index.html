<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>レッスン52: 入力検証</title>
  <script src="script.js"></script>
</head>
<body>
  <h1>ユーザー登録フォーム</h1>

  <section>
    <h2>登録情報</h2>
    <div>
      <label>ユーザー名:</label>
      <input id="username" type="text" placeholder="3-15文字">
    </div>
    <div>
      <label>パスワード:</label>
      <input id="password" type="password" placeholder="6文字以上">
    </div>
    <div>
      <label>年齢:</label>
      <input id="age" type="text" placeholder="13歳以上">
    </div>
    <button onclick="validateRegistration()">登録</button>
  </section>

  <section>
    <h2>結果</h2>
    <p id="result" style="color: green;"></p>
    <p id="error" style="color: red;"></p>
  </section>
</body>
</html>
