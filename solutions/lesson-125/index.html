<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 125 - Solution</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 10px;
    }

    .info {
      text-align: center;
      margin-bottom: 30px;
      padding: 15px;
      background: #e3f2fd;
      border-radius: 5px;
    }

    .info p {
      margin: 5px 0;
      font-size: 14px;
      color: #1976d2;
    }

    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 5px;
    }

    .section h2 {
      margin-top: 0;
      color: #667eea;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #45a049;
    }

    .result-box {
      padding: 15px;
      background: #e8f5e9;
      border-left: 4px solid #4CAF50;
      border-radius: 3px;
      margin: 10px 0;
    }

    .counter-display {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
      margin: 15px 0;
      padding: 15px;
      background: white;
      border: 2px solid #667eea;
      border-radius: 5px;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>関数を返す関数</h1>

    <div class="info">
      <p><strong>関数ファクトリー - カスタマイズ可能な関数</strong></p>
      <p>return function() { } でクロージャを活用</p>
    </div>

    <!-- 例1: 挨拶ファクトリー -->
    <div class="section">
      <h2>1. 挨拶ファクトリー</h2>
      <input type="text" id="nameInput" value="太郎" placeholder="名前を入力">
      <div class="button-group">
        <button onclick="sayHello()">こんにちは</button>
        <button onclick="sayGoodbye()">さようなら</button>
      </div>
      <div id="greetResult" class="result-box"></div>
    </div>

    <!-- 例2: 掛け算ファクトリー -->
    <div class="section">
      <h2>2. 掛け算ファクトリー</h2>
      <input type="number" id="multiplyInput" value="5" placeholder="数値を入力">
      <div class="button-group">
        <button onclick="applyDouble()">2倍</button>
        <button onclick="applyTriple()">3倍</button>
      </div>
      <div id="multiplyResult" class="result-box"></div>
    </div>

    <!-- 例3: カウンター -->
    <div class="section">
      <h2>3. 独立したカウンター</h2>
      <div>
        <h3>カウンター1</h3>
        <div class="counter-display" id="counter1Display">0</div>
        <div class="button-group">
          <button onclick="incrementCounter1()">+1</button>
          <button onclick="decrementCounter1()">-1</button>
        </div>
      </div>
      <div style="margin-top: 20px;">
        <h3>カウンター2</h3>
        <div class="counter-display" id="counter2Display">0</div>
        <div class="button-group">
          <button onclick="incrementCounter2()">+1</button>
          <button onclick="decrementCounter2()">-1</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
