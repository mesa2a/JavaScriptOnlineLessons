<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 138</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin: 30px 0;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }
        .section h3 {
            color: #2c5f2d;
            margin-top: 0;
        }
        .product-item {
            padding: 10px;
            margin: 10px 0;
            background-color: white;
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
        }
        .stat-box {
            display: inline-block;
            padding: 15px 25px;
            margin: 10px;
            background-color: #4CAF50;
            color: white;
            border-radius: 8px;
            font-size: 18px;
        }
        .hint {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>商品カタログシステム</h1>

    <div class="section">
        <h3>全商品リスト</h3>
        <div id="productList"></div>
    </div>

    <div class="section">
        <h3>統計情報</h3>
        <div class="stat-box">
            在庫10個以上: <span id="highStock"></span>個
        </div>
        <div class="stat-box">
            総在庫金額: <span id="totalValue"></span>円
        </div>
        <div class="stat-box">
            最高額商品: <span id="mostExpensive"></span>
        </div>
    </div>

    <div class="hint">
        <strong>ヒント:</strong> オブジェクトの配列をforループで処理します。各要素は array[i] でアクセスし、プロパティは array[i].property でアクセスします。
    </div>

    <script src="script.js"></script>
</body>
</html>
