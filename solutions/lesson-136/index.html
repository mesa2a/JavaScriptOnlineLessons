<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 136</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }
        #display {
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            background-color: #f9f9f9;
        }
        .property {
            padding: 10px;
            margin: 5px 0;
            background-color: white;
            border-radius: 4px;
            border-left: 4px solid #4CAF50;
        }
        .controls {
            margin: 15px 0;
        }
        button {
            padding: 12px 20px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
        }
        #updateName {
            background-color: #2196F3;
        }
        #updateName:hover {
            background-color: #0b7dda;
        }
        #addEmail {
            background-color: #4CAF50;
        }
        #addEmail:hover {
            background-color: #45a049;
        }
        #deleteCity {
            background-color: #f44336;
        }
        #deleteCity:hover {
            background-color: #da190b;
        }
    </style>
</head>
<body>
    <h1>学生情報管理</h1>

    <div id="display"></div>

    <div class="controls">
        <button id="updateName">名前を変更</button>
        <button id="addEmail">メールを追加</button>
        <button id="deleteCity">都市を削除</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
