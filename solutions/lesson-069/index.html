<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 069</title>
    <style>
        #outer {
            width: 400px;
            height: 300px;
            background-color: lightblue;
            padding: 20px;
            cursor: pointer;
        }
        #middle {
            width: 300px;
            height: 200px;
            background-color: lightgreen;
            padding: 20px;
            cursor: pointer;
        }
        #inner {
            width: 200px;
            height: 100px;
            background-color: lightcoral;
            cursor: pointer;
        }
        #log {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            min-height: 30px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>イベント伝播の確認</h1>
    <p>各要素をクリックして、イベントの伝播を確認してください</p>

    <div id="outer">
        Outer
        <div id="middle">
            Middle
            <div id="inner">
                Inner
            </div>
        </div>
    </div>

    <p id="log"></p>

    <script src="script.js"></script>
</body>
</html>
