<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>レッスン41: 入力方法の比較</title>
  <script src="script.js"></script>
</head>
<body>
  <h1>入力方法の比較</h1>

  <section>
    <h2>promptを使う方法</h2>
    <button onclick="usePrompt()">promptで入力</button>
  </section>

  <section>
    <h2>inputを使う方法</h2>
    <input id="name" type="text" placeholder="名前を入力">
    <button onclick="useInput()">inputから取得</button>
  </section>

  <p id="result"></p>
</body>
</html>
