<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 140</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin: 30px 0;
            padding: 25px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }
        .section h2 {
            color: #2c5f2d;
            margin-top: 0;
        }
        .property-item {
            padding: 12px;
            margin: 10px 0;
            background-color: white;
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
        }
        .property-item strong {
            color: #2c5f2d;
            min-width: 120px;
            display: inline-block;
        }
        .stat-box {
            display: inline-block;
            padding: 15px 25px;
            margin: 10px;
            background-color: #2196F3;
            color: white;
            border-radius: 8px;
            font-size: 18px;
        }
        .key-list {
            padding: 15px;
            background-color: white;
            border: 2px solid #4CAF50;
            border-radius: 4px;
        }
        .key-badge {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            background-color: #4CAF50;
            color: white;
            border-radius: 20px;
            font-size: 14px;
        }
        .hint {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>商品プロパティ分析システム</h1>

    <div class="section">
        <h2>1. 全プロパティ一覧</h2>
        <div id="allProperties"></div>
    </div>

    <div class="section">
        <h2>2. 統計情報</h2>
        <div class="stat-box">
            プロパティ総数: <span id="propertyCount">0</span>
        </div>
    </div>

    <div class="section">
        <h2>3. 数値型プロパティのみ</h2>
        <div id="numericProperties"></div>
    </div>

    <div class="section">
        <h2>4. プロパティ名リスト</h2>
        <div id="keyList" class="key-list"></div>
    </div>

    <div class="hint">
        <strong>ヒント:</strong>
        <ul>
            <li><code>for (let key in object)</code> でオブジェクトの全プロパティを反復処理できます</li>
            <li><code>object[key]</code> でプロパティの値にアクセスします</li>
            <li><code>typeof value === 'number'</code> で数値型かどうかを判定できます</li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
