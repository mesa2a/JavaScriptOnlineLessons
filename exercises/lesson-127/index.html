<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 127 - Exercise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 10px;
    }

    .info {
      text-align: center;
      margin-bottom: 30px;
      padding: 15px;
      background: #e3f2fd;
      border-radius: 5px;
    }

    .info p {
      margin: 5px 0;
      font-size: 14px;
      color: #1976d2;
    }

    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 5px;
    }

    .section h2 {
      margin-top: 0;
      color: #667eea;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #45a049;
    }

    .result-box {
      padding: 15px;
      background: #e8f5e9;
      border-left: 4px solid #4CAF50;
      border-radius: 3px;
      margin: 10px 0;
      min-height: 50px;
      font-family: monospace;
      white-space: pre-line;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>再帰入門</h1>

    <div class="info">
      <p><strong>再帰関数 - 自分自身を呼び出す</strong></p>
      <p>ベースケース（終了条件）が必須</p>
    </div>

    <!-- 例1: カウントダウン -->
    <div class="section">
      <h2>1. カウントダウン</h2>
      <input type="number" id="countdownInput" value="5" placeholder="開始数値">
      <button onclick="testCountdown()">カウントダウン実行</button>
      <div id="countdownResult" class="result-box"></div>
    </div>

    <!-- 例2: 階乗 -->
    <div class="section">
      <h2>2. 階乗（Factorial）</h2>
      <input type="number" id="factorialInput" value="5" placeholder="数値">
      <button onclick="testFactorial()">階乗を計算</button>
      <div id="factorialResult" class="result-box"></div>
    </div>

    <!-- 例3: 累乗 -->
    <div class="section">
      <h2>3. 累乗（Power）</h2>
      <input type="number" id="baseInput" value="2" placeholder="底">
      <input type="number" id="exponentInput" value="3" placeholder="指数">
      <button onclick="testPower()">累乗を計算</button>
      <div id="powerResult" class="result-box"></div>
    </div>

    <!-- 例4: 配列の合計 -->
    <div class="section">
      <h2>4. 配列の合計</h2>
      <button onclick="testSum()">合計を計算</button>
      <div id="sumResult" class="result-box"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
