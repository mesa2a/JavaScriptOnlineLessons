<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レッスン149：TODOアプリ（見た目編）</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .input-area {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    #taskInput {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      transition: border-color 0.3s;
    }

    #taskInput:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    button:active {
      transform: translateY(0);
    }

    #taskList {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      min-height: 200px;
    }

    .task-item {
      padding: 15px;
      margin-bottom: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid #667eea;
      transition: all 0.3s;
    }

    .task-item:hover {
      transform: translateX(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .task-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .task-item span {
      flex: 1;
      font-size: 16px;
      color: #333;
    }

    .task-item.done {
      opacity: 0.6;
    }

    .task-item.done span {
      text-decoration: line-through;
      color: #999;
    }

    .task-item button {
      background: #ff6b6b;
      padding: 8px 16px;
      font-size: 14px;
    }

    .task-item button:hover {
      background: #ff5252;
    }

    .empty {
      text-align: center;
      color: #999;
      font-style: italic;
      padding: 40px 20px;
    }

    @media (max-width: 768px) {
      .container {
        margin: 20px auto;
      }

      h1 {
        font-size: 2em;
      }

      .input-area {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TODOリスト</h1>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="新しいタスクを入力...">
      <button onclick="handleAdd()">追加</button>
    </div>

    <div id="taskList"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
