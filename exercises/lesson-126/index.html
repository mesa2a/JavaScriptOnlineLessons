<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 126 - Exercise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 10px;
    }

    .info {
      text-align: center;
      margin-bottom: 30px;
      padding: 15px;
      background: #e3f2fd;
      border-radius: 5px;
    }

    .info p {
      margin: 5px 0;
      font-size: 14px;
      color: #1976d2;
    }

    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 5px;
    }

    .section h2 {
      margin-top: 0;
      color: #667eea;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #45a049;
    }

    .result-box {
      padding: 15px;
      background: #e8f5e9;
      border-left: 4px solid #4CAF50;
      border-radius: 3px;
      margin: 10px 0;
      min-height: 50px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>関数を引数に</h1>

    <div class="info">
      <p><strong>コールバック関数 - 処理の委譲</strong></p>
      <p>function(callback) { callback(); }</p>
    </div>

    <!-- 例1: forEach -->
    <div class="section">
      <h2>1. forEach - 配列の各要素を処理</h2>
      <button onclick="testForEach()">実行</button>
      <div id="forEachResult" class="result-box"></div>
    </div>

    <!-- 例2: filter -->
    <div class="section">
      <h2>2. filter - 条件に合う要素を抽出</h2>
      <input type="number" id="filterInput" value="3" placeholder="この値より大きい数を抽出">
      <button onclick="testFilter()">フィルター実行</button>
      <div id="filterResult" class="result-box"></div>
    </div>

    <!-- 例3: map -->
    <div class="section">
      <h2>3. map - 各要素を変換</h2>
      <div class="button-group">
        <button onclick="testMapDouble()">2倍</button>
        <button onclick="testMapSquare()">2乗</button>
      </div>
      <div id="mapResult" class="result-box"></div>
    </div>

    <!-- 例4: カスタム処理 -->
    <div class="section">
      <h2>4. repeat - 処理を繰り返す</h2>
      <input type="number" id="repeatInput" value="5" placeholder="繰り返す回数">
      <div class="button-group">
        <button onclick="testRepeatStar()">★を表示</button>
        <button onclick="testRepeatNumber()">数字を表示</button>
      </div>
      <div id="repeatResult" class="result-box"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
