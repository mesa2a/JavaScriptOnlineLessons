<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>完成版TODOアプリ - 練習問題</title>
</head>
<body>
  <h1>TODO管理</h1>

  <div>
    <input type="text" id="todoInput" placeholder="新しいタスクを入力">
    <button id="addButton">追加</button>
  </div>

  <div id="stats"></div>

  <div>
    <button id="filterAll">全て</button>
    <button id="filterActive">未完了</button>
    <button id="filterCompleted">完了済み</button>
  </div>

  <div id="todoList"></div>

  <script src="script.js"></script>
</body>
</html>
