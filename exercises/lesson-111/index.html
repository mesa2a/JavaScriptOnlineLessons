<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 111 - Exercise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #45a049;
    }

    #output {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 5px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h1>あいさつアプリ</h1>

  <div class="input-group">
    <label for="nameInput">名前</label>
    <input type="text" id="nameInput" placeholder="名前を入力">
  </div>

  <div class="input-group">
    <label for="timeSelect">時間帯</label>
    <select id="timeSelect">
      <option value="morning">朝</option>
      <option value="afternoon">昼</option>
      <option value="evening">夜</option>
    </select>
  </div>

  <button onclick="showGreeting()">あいさつ</button>

  <div id="output"></div>

  <script src="script.js"></script>
</body>
</html>
