<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 121 - Exercise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .input-section {
      margin-bottom: 20px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 5px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 18px;
      box-sizing: border-box;
      text-align: center;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 20px;
      border: none;
      border-radius: 5px;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }

    .op-btn {
      background: #4CAF50;
      color: white;
    }

    .op-btn:hover {
      background: #45a049;
      transform: scale(1.05);
    }

    .clear-btn {
      background: #9E9E9E;
      color: white;
      grid-column: 1 / -1;
      font-size: 16px;
    }

    .clear-btn:hover {
      background: #757575;
    }

    .result {
      margin-bottom: 20px;
      padding: 20px;
      background: #e8f5e9;
      border-left: 4px solid #4CAF50;
      border-radius: 5px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #2e7d32;
    }

    .history-section {
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 5px;
    }

    .history-section h2 {
      margin-top: 0;
      color: #667eea;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-history-btn {
      padding: 5px 15px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
    }

    .clear-history-btn:hover {
      background: #da190b;
    }

    .history-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .history-item {
      padding: 10px;
      margin-bottom: 8px;
      background: white;
      border-left: 3px solid #2196F3;
      border-radius: 3px;
      font-family: monospace;
      font-size: 14px;
    }

    .history-empty {
      text-align: center;
      color: #999;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>関数型電卓</h1>
    <p class="subtitle">週のプロジェクト - 各演算を関数化した電卓</p>

    <div class="input-section">
      <div class="input-group">
        <label for="num1">数値1</label>
        <input type="number" id="num1" value="10" placeholder="数値を入力">
      </div>

      <div class="input-group">
        <label for="num2">数値2</label>
        <input type="number" id="num2" value="5" placeholder="数値を入力">
      </div>
    </div>

    <div class="buttons">
      <button class="op-btn" onclick="performAdd()">+</button>
      <button class="op-btn" onclick="performSubtract()">-</button>
      <button class="op-btn" onclick="performMultiply()">×</button>
      <button class="op-btn" onclick="performDivide()">÷</button>
      <button class="clear-btn" onclick="clearCalculator()">クリア</button>
    </div>

    <div id="result" class="result">結果: </div>

    <div class="history-section">
      <h2>
        計算履歴
        <button class="clear-history-btn" onclick="clearHistory()">履歴削除</button>
      </h2>
      <div id="history" class="history-list">
        <div class="history-empty">まだ計算履歴がありません</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
