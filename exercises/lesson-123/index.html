<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 123 - Exercise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 10px;
    }

    .info {
      text-align: center;
      margin-bottom: 30px;
      padding: 15px;
      background: #e3f2fd;
      border-radius: 5px;
    }

    .info p {
      margin: 5px 0;
      font-size: 14px;
      color: #1976d2;
    }

    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 5px;
    }

    .section h2 {
      margin-top: 0;
      color: #667eea;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
    }

    button:hover {
      background: #45a049;
      transform: scale(1.02);
    }

    .counter-display {
      text-align: center;
      font-size: 48px;
      font-weight: bold;
      color: #667eea;
      margin: 20px 0;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .up-btn {
      background: #2196F3;
    }

    .up-btn:hover {
      background: #0b7dda;
    }

    .down-btn {
      background: #f44336;
    }

    .down-btn:hover {
      background: #da190b;
    }

    .reset-btn {
      background: #9E9E9E;
    }

    .reset-btn:hover {
      background: #757575;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .error {
      color: #f44336;
      font-size: 14px;
      margin-top: 5px;
      min-height: 20px;
    }

    .message {
      padding: 15px;
      background: #e8f5e9;
      border-left: 4px solid #4CAF50;
      border-radius: 3px;
      margin-top: 15px;
      display: none;
    }

    .message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>無名関数の活用</h1>

    <div class="info">
      <p><strong>addEventListener内で無名関数を使う</strong></p>
      <p>一度だけ使う関数は、その場で定義</p>
    </div>

    <!-- カウンターアプリ -->
    <div class="section">
      <h2>1. カウンターアプリ</h2>
      <div class="counter-display" id="counterDisplay">0</div>
      <div class="button-group">
        <button class="up-btn" id="upBtn">+1</button>
        <button class="down-btn" id="downBtn">-1</button>
        <button class="reset-btn" id="resetBtn">リセット</button>
      </div>
    </div>

    <!-- 入力バリデーション -->
    <div class="section">
      <h2>2. リアルタイム入力チェック</h2>
      <label>名前（3文字以上）</label>
      <input type="text" id="nameInput" placeholder="名前を入力">
      <div class="error" id="nameError"></div>

      <label>メールアドレス</label>
      <input type="email" id="emailInput" placeholder="example@mail.com">
      <div class="error" id="emailError"></div>

      <button id="submitBtn">送信</button>
      <div class="message" id="successMessage">登録が完了しました！</div>
    </div>

    <!-- ボタンホバー効果 -->
    <div class="section">
      <h2>3. マウスイベント</h2>
      <button id="hoverBtn">マウスを乗せてみてください</button>
      <div class="message" id="hoverMessage"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
