<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 113 - Exercise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #45a049;
    }

    #output {
      margin-top: 20px;
      padding: 20px;
      background: #f0f0f0;
      border-radius: 5px;
      text-align: center;
      min-height: 80px;
    }
  </style>
</head>
<body>
  <h1>BMI計算アプリ</h1>

  <div class="input-group">
    <label for="height">身長（cm）</label>
    <input type="number" id="height" placeholder="例: 170">
  </div>

  <div class="input-group">
    <label for="weight">体重（kg）</label>
    <input type="number" id="weight" placeholder="例: 60">
  </div>

  <button onclick="calculate()">計算</button>

  <div id="output"></div>

  <script src="script.js"></script>
</body>
</html>
