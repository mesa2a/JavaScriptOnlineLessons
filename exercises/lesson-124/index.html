<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 124 - Exercise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 10px;
    }

    .info {
      text-align: center;
      margin-bottom: 30px;
      padding: 15px;
      background: #e3f2fd;
      border-radius: 5px;
    }

    .info p {
      margin: 5px 0;
      font-size: 14px;
      color: #1976d2;
    }

    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 5px;
    }

    .section h2 {
      margin-top: 0;
      color: #667eea;
      font-size: 18px;
    }

    .result-box {
      padding: 15px;
      background: #e8f5e9;
      border-left: 4px solid #4CAF50;
      border-radius: 3px;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #45a049;
    }

    #app-info, #counter-display, #calc-result {
      margin: 15px 0;
      padding: 15px;
      background: white;
      border: 2px solid #667eea;
      border-radius: 5px;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>即時実行関数（IIFE）</h1>

    <div class="info">
      <p><strong>Immediately Invoked Function Expression</strong></p>
      <p>(function() { })(); - 定義と同時に実行</p>
    </div>

    <!-- 例1: アプリ初期化 -->
    <div class="section">
      <h2>1. アプリの初期化</h2>
      <div id="app-info">初期化待ち...</div>
    </div>

    <!-- 例2: 計算結果 -->
    <div class="section">
      <h2>2. 計算結果</h2>
      <div id="calc-result">計算待ち...</div>
    </div>

    <!-- 例3: カウンター -->
    <div class="section">
      <h2>3. プライベート変数を持つカウンター</h2>
      <div id="counter-display">カウント: 0</div>
      <div class="button-group">
        <button onclick="incrementCounter()">+1</button>
        <button onclick="decrementCounter()">-1</button>
        <button onclick="showCount()">表示</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
